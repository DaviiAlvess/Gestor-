<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Gestor  finanças pessoais no seu dispositivo</title>
  <desc id="desc">Capa comercial com o resultado do mês, receitas, despesas e um gráfico de entradas e saídas.</desc>
  <rect width="1200" height="520" fill="#193d32"/>
  <rect x="72" y="64" width="44" height="46" rx="12" fill="#e2e8d2"/>
  <text x="84" y="100" font-family="Georgia, serif" font-size="42" fill="#254838">g</text>
  <text x="128" y="102" font-family="Georgia, serif" font-size="42" fill="#f1f3e9">gestor</text>
  <text x="268" y="102" font-family="Georgia, serif" font-size="42" fill="#d6c69c">.</text>
  <text x="72" y="168" font-family="Georgia, serif" font-size="44" fill="#f1f3e9">Seu dinheiro, com clareza.</text>
  <text x="72" y="214" font-family="Arial, sans-serif" font-size="18" fill="#b9cabe">Receitas, despesas e contas no seu aparelho. Sem nuvem. Sem mensalidade.</text>
  <g transform="translate(72 268)">
    <rect width="250" height="164" rx="16" fill="#244d3e"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="13" fill="#d3dfd5">Resultado confirmado</text>
    <text x="22" y="92" font-family="Georgia, serif" font-size="36" fill="#ffffff">R$ 2.480</text>
    <text x="22" y="128" font-family="Arial, sans-serif" font-size="12" fill="#bbcec1">Exemplo ilustrativo do mês</text>
  </g>
  <g transform="translate(346 268)">
    <rect width="250" height="164" rx="16" fill="#f7f8f4"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="13" fill="#7c847e">Receitas</text>
    <text x="22" y="92" font-family="Georgia, serif" font-size="32" fill="#244d3e">R$ 6.200</text>
    <rect x="22" y="118" width="190" height="6" rx="3" fill="#edf3e9"/>
    <rect x="22" y="118" width="150" height="6" rx="3" fill="#96ac7c"/>
  </g>
  <g transform="translate(620 268)">
    <rect width="250" height="164" rx="16" fill="#f7f8f4"/>
    <text x="22" y="38" font-family="Arial, sans-serif" font-size="13" fill="#7c847e">Despesas</text>
    <text x="22" y="92" font-family="Georgia, serif" font-size="32" fill="#b77752">R$ 3.720</text>
    <rect x="22" y="118" width="190" height="6" rx="3" fill="#f6efe8"/>
    <rect x="22" y="118" width="110" height="6" rx="3" fill="#cb9f76"/>
  </g>
  <g transform="translate(894 268)">
    <rect width="234" height="164" rx="16" fill="#f7f8f4"/>
    <text x="18" y="32" font-family="Arial, sans-serif" font-size="12" fill="#7c847e">Movimento do mês</text>
    <polyline fill="none" stroke="#779362" stroke-width="3" points="28,128 58,104 88,112 118,78 148,90 178,62 208,70"/>
    <polyline fill="none" stroke="#cfaa83" stroke-width="3" points="28,118 58,122 88,96 118,108 148,102 178,88 208,94"/>
  </g>
</svg>
